name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: "11"
          distribution: temurin
          cache: gradle
      - name: Build
        run: ./gradlew :riru:zipDebug :riru:zipRelease
      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: riru-debug
          path: out/*debug*.zip
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: riru-release
          path: out/*release*.zip
